interfaces:
  - id: shell
    label: Interactive Shell
    description: Open a terminal directly on the compute node via srun
    software_id: bash
    job_type: srun

  - id: ssh
    label: SSH
    description: Connect via SSH from any client or terminal
    software_id: ssh
    job_type: srun
    software_option_overrides:
      ready_message: "\\n\\033[1;32m=== SSH ready: root@{hostname} port {port} ===\\033[0m\\n\\n"

  - id: vscode
    label: VSCode Remote
    description: Connect using the VSCode Remote SSH extension
    software_id: ssh
    job_type: srun
    software_option_overrides:
      sftp: true
      ready_message: "\\n\\033[1;36mOpen in VSCode:\\033[0m vscode://vscode-remote/ssh-remote+root@{hostname}.medien.uni-weimar.de:{port}{home}\\n\\n"

  - id: pycharm
    label: PyCharm Remote
    description: Connect using PyCharm Remote Development (Gateway)
    software_id: ssh
    job_type: srun
    software_option_overrides:
      sftp: true
      ready_message: "\\n\\033[1;32m=== SSH ready: root@{hostname} port {port} ===\\033[0m\\n\\n"
      pycharm_message: "\\n\\033[1;32m=== PyCharm Gateway ===\\033[0m\\n  Host: {hostname}.medien.uni-weimar.de  Port: {port}  User: root\\n\\n"

  - id: jupyter
    label: Jupyter Lab
    description: Launch a browser-based notebook server
    software_id: jupyter
    job_type: srun

  - id: batch
    label: Batch Job (no interface)
    description: Submit a job script that runs unattended in the background via sbatch
    software_id: bash
    job_type: sbatch
