name: Publish Docker Images

on:
  push:
    branches: [main, master]
    paths:
      - baseimages/**

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push pytorch image
        uses: docker/build-push-action@v6
        with:
          context: baseimages
          file: baseimages/gpu-jobs.Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/pytorch:2.8.0-cuda12.9-cudnn9-runtime
